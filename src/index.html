<!DOCTYPE html>
<html>

    <head>
        <title>Gmail Extension</title>
        <style>
            body {
                width: 300px;
                font-family: Arial, sans-serif;
            }

            .authorized {
                display: none;
            }

            .unauthorized {
                display: none;
            }
        </style>
    </head>

    <body>
        <div class="authorized">
            <p>Welcome, <span class="username"></span></p>
            <h2>Loggedin</h2>
        </div>
        <div class="unauthorized">
            <h2>Login</h2>
            <button id="redirectBtn">Click Here to login</button>
        </div>
        <script src="config.js"></script>
        <script src="popup.js"></script>
    </body>

</html>
